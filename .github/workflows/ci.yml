name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check Out
        uses: actions/checkout@v7

      - name: Set Up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify Docker
        run: docker version

      - name: Run Go Tests
        run: make test

      - name: Run Zot E2E Harness
        run: make test-e2e

      # Native deploys against a throwaway systemd server (no Docker on it),
      # including the native kamal-proxy and certificates from Pebble.
      - name: Run Native E2E
        run: make test-e2e-native

      # Docker and native apps behind one kamal-proxy on the same server.
      - name: Run Mixed E2E
        run: make test-e2e-mixed
